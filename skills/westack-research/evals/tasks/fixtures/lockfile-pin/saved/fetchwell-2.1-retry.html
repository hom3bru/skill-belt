<h1>fetchwell 2.1: retries</h1>
<p>Pass a <code>retry</code> object to <code>createClient</code>. Keys other than those below are ignored without an
error.</p>
<h2>retry.attempts</h2>
<p>How many times to retry a failed request. Default: 0.</p>
<h2>retry.backoff</h2>
<p>"fixed" or "exponential". Default: "exponential".</p>
</body></html>
