<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings">
    <h1>Settings</h1>
    <section>
      <h2>Profile</h2>
      <label>Name <input name="name" value="Sam Doe"></label>
      <label>Email <input name="email" type="email" value="sam@example.com"></label>
    </section>
    <section>
      <h2>Notifications</h2>
      <label><input type="checkbox" checked> Email me when an invoice is paid</label>
      <label><input type="checkbox"> Weekly summary</label>
    </section>
    <button class="save">Save changes</button>
  </main>
</body>
</html>
